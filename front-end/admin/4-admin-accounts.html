<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Management</title>
<link rel="stylesheet" href="admin.css">
<style>
    .accounts-container {
        width: 92%;
        max-width: 1200px;
        margin: 20px auto;
        position: relative;
        z-index: 1;
    }

    .accounts-card {
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 32px;
        box-shadow: var(--glass-shadow);
        margin-bottom: 24px;
        position: relative;
    }


    .accounts-card h2 {
        color: var(--text-primary);
        margin-bottom: 24px;
        font-size: 22px;
        font-weight: 700;
    }

    body.light-mode .accounts-card h2 {
        color: var(--blue);
    }

    .filter-row {
        display: flex;
        gap: 16px;
        margin-bottom: 24px;
        flex-wrap: wrap;
    }

    .filter-row select,
    .filter-row input {
        padding: 12px 18px;
        border-radius: 12px;
        border: 1px solid var(--glass-border);
        font-size: 14px;
        font-family: inherit;
        background: var(--glass-bg);
        color: var(--text-primary);
        transition: all 0.25s ease;
    }

    .filter-row select option {
        background: #1a2744;
        color: white;
    }

    body.light-mode .filter-row select option {
        background: white;
        color: #1a1a1a;
    }

    body.light-mode .filter-row select,
    body.light-mode .filter-row input {
        background: rgba(255, 255, 255, 0.9);
        color: #1a1a1a;
    }

    .filter-row input {
        flex: 1;
        min-width: 200px;
    }

    .filter-row input::placeholder {
        color: var(--text-muted);
    }

    .filter-row select:focus,
    .filter-row input:focus {
        outline: none;
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(0, 51, 160, 0.2);
    }

    .accounts-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
    }

    .accounts-table th,
    .accounts-table td {
        padding: 16px 18px;
        text-align: left;
        border-bottom: 1px solid var(--glass-border);
    }

    .accounts-table th {
        background: var(--glass-bg);
        color: var(--text-primary);
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    body.light-mode .accounts-table th {
        color: var(--blue);
    }

    .accounts-table td {
        color: var(--text-primary);
        font-size: 14px;
    }

    body.light-mode .accounts-table td {
        color: #333;
    }

    .accounts-table tr:hover td {
        background: var(--glass-bg);
    }

    .role-badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        text-transform: capitalize;
    }

    .role-badge.student {
        background: rgba(34, 197, 94, 0.2);
        color: #22c55e;
    }

    .role-badge.teacher {
        background: rgba(59, 130, 246, 0.2);
        color: #3b82f6;
    }

    .role-badge.admin {
        background: rgba(139, 92, 246, 0.2);
        color: #8b5cf6;
    }

    .delete-btn {
        padding: 10px 18px;
        background: linear-gradient(135deg, #ef4444, #dc2626);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s ease;
        font-family: inherit;
    }

    .delete-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
    }

    .delete-btn:disabled {
        background: var(--glass-bg);
        color: var(--text-muted);
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }

    .stats-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 20px;
        margin-bottom: 28px;
    }

    .stat-mini {
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 24px;
        text-align: center;
        box-shadow: var(--glass-shadow);
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
    }

    .stat-mini:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
    }

    .stat-mini .value {
        font-size: 32px;
        font-weight: 700;
        color: var(--gold);
        display: block;
        line-height: 1.2;
    }

    body.light-mode .stat-mini .value {
        color: var(--blue);
    }

    .stat-mini .label {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 500;
    }

    .empty-message {
        text-align: center;
        padding: 50px;
        color: var(--text-secondary);
        font-size: 15px;
    }

    .success-toast,
    .error-toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        padding: 18px 28px;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 600;
        z-index: 10000;
        animation: slideIn 0.3s ease;
        display: none;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    .success-toast {
        background: rgba(34, 197, 94, 0.9);
        color: white;
    }

    .error-toast {
        background: rgba(239, 68, 68, 0.9);
        color: white;
    }

    .success-toast.show,
    .error-toast.show {
        display: block;
    }

    @keyframes slideIn {
        from { opacity: 0; transform: translateX(50px); }
        to { opacity: 1; transform: translateX(0); }
    }
</style>
</head>
<body>

<nav class="top-nav">
    <div class="nav-left">
        <a href="1-index.html"><img src="https://www.leanderisd.org/wp-content/uploads/2025/05/LEANDER✵ISD-Duotone-Blue-With-Tagline.png" class="lisd-logo"></a>
    </div>
    <div class="nav-right">
        <a href="1-index.html" class="nav-link">Home</a>
        <a href="2-admin-analytics.html" class="nav-link">Analytics</a>
        <a href="3-admin-feedback.html" class="nav-link">Feedback</a>
        <a href="4-admin-accounts.html" class="nav-link active">Accounts</a>
        <div class="profile-dropdown">
            <div class="nav-icon" id="profileBtn" style="display:flex;align-items:center;justify-content:center;background:var(--gold);color:#1a1a1a;font-weight:700;font-size:14px;">A</div>
            <div class="dropdown-menu hide" id="profileMenu">
                <h3>Admin Settings</h3>
                <button class="dropdown-item" id="themeToggle">Toggle Light/Dark Mode</button>
                <button class="dropdown-item" onclick="window.location.href='settings.html'">Settings</button>
                <button class="dropdown-item" onclick="sessionStorage.clear(); window.location.href='/'">Logout</button>
            </div>
        </div>
    </div>
</nav>

<header class="app-header">
    <h1>Account Management</h1>
</header>

<div class="accounts-container">
    <!-- Stats -->
    <div class="stats-row">
        <div class="stat-mini">
            <span class="value" id="totalUsers">0</span>
            <span class="label">Total Users</span>
        </div>
        <div class="stat-mini">
            <span class="value" id="totalStudents">0</span>
            <span class="label">Students</span>
        </div>
        <div class="stat-mini">
            <span class="value" id="totalTeachers">0</span>
            <span class="label">Teachers</span>
        </div>
        <div class="stat-mini">
            <span class="value" id="totalAdmins">0</span>
            <span class="label">Administrators</span>
        </div>
    </div>

    <!-- Accounts Table -->
    <div class="accounts-card">
        <h2>User Accounts</h2>
        <div class="filter-row">
            <select id="roleFilter">
                <option value="all">All Roles</option>
                <option value="student">Students Only</option>
                <option value="teacher">Teachers Only</option>
                <option value="admin">Admins Only</option>
            </select>
            <input type="text" id="searchInput" placeholder="Search by username or name...">
        </div>

        <table class="accounts-table">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Teacher Name</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="accountsBody">
                <tr><td colspan="5" class="empty-message">Loading accounts...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div class="success-toast" id="successToast">Account deleted successfully</div>
<div class="error-toast" id="errorToast">Failed to delete account</div>

<script src="admin.js"></script>
<script>
    const API_URL = "https://reflectify-6h6q.onrender.com";
    let allUsers = [];

    async function loadUsers() {
        try {
            const res = await fetch(`${API_URL}/api/users`);
            if (!res.ok) throw new Error('Failed to fetch users');
            allUsers = await res.json();
            updateStats();
            renderUsers();
        } catch (err) {
            console.error('Error loading users:', err);
            document.getElementById('accountsBody').innerHTML = 
                '<tr><td colspan="5" class="empty-message" style="color:#e53935">Failed to load accounts</td></tr>';
        }
    }

    function updateStats() {
        document.getElementById('totalUsers').textContent = allUsers.length;
        document.getElementById('totalStudents').textContent = allUsers.filter(u => u.role === 'student').length;
        document.getElementById('totalTeachers').textContent = allUsers.filter(u => u.role === 'teacher').length;
        document.getElementById('totalAdmins').textContent = allUsers.filter(u => u.role === 'admin').length;
    }

    function renderUsers() {
        const roleFilter = document.getElementById('roleFilter').value;
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        
        let filtered = allUsers;
        
        if (roleFilter !== 'all') {
            filtered = filtered.filter(u => u.role === roleFilter);
        }
        
        if (searchTerm) {
            filtered = filtered.filter(u => 
                u.username.toLowerCase().includes(searchTerm) ||
                (u.name && u.name.toLowerCase().includes(searchTerm))
            );
        }

        const tbody = document.getElementById('accountsBody');
        
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-message">No accounts found</td></tr>';
            return;
        }

        tbody.innerHTML = filtered.map(user => `
            <tr>
                <td>${user.username}</td>
                <td>${user.name || '-'}</td>
                <td><span class="role-badge ${user.role}">${user.role}</span></td>
                <td>${user.teacherName || '-'}</td>
                <td>
                    ${user.role !== 'admin' 
                        ? `<button class="delete-btn" onclick="deleteUser('${user.username}')">Delete</button>`
                        : '<span style="color:#888; font-size:12px">Protected</span>'
                    }
                </td>
            </tr>
        `).join('');
    }

    async function deleteUser(username) {
        if (!confirm(`Are you sure you want to delete the account "${username}"? This cannot be undone.`)) {
            return;
        }

        const currentUser = JSON.parse(sessionStorage.getItem('user'));
        if (!currentUser || currentUser.role !== 'admin') {
            showToast('error', 'You must be an administrator to delete accounts');
            return;
        }

        try {
            const res = await fetch(`${API_URL}/api/users/${encodeURIComponent(username)}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminUsername: currentUser.username })
            });

            const data = await res.json();
            
            if (!res.ok) {
                throw new Error(data.message || 'Failed to delete account');
            }

            showToast('success', `Account "${username}" deleted successfully`);
            loadUsers();
        } catch (err) {
            console.error('Delete error:', err);
            showToast('error', err.message);
        }
    }

    function showToast(type, message) {
        const toast = document.getElementById(type === 'success' ? 'successToast' : 'errorToast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Event listeners
    document.getElementById('roleFilter').addEventListener('change', renderUsers);
    document.getElementById('searchInput').addEventListener('input', renderUsers);

    // Initial load
    loadUsers();
</script>
</body>
</html>
