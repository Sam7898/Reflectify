<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Feedback - Reflectify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="teacher.css">
    <style>
        .feedback-header {
            width: 92%;
            max-width: 900px;
            margin: 0 auto 28px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 28px;
            display: flex;
            align-items: center;
            gap: 24px;
            box-shadow: var(--glass-shadow);
            position: relative;
            z-index: 1;
        }


        .feedback-header img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .feedback-header-text h3 {
            color: var(--text-primary);
            font-size: 18px;
            margin-bottom: 6px;
        }

        body.light-mode .feedback-header-text h3 {
            color: var(--blue);
        }

        .feedback-header-text p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .feedback-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-left">
            <a href="index.html"><img src="https://www.leanderisd.org/wp-content/uploads/2025/05/LEANDER✵ISD-Duotone-Blue-With-Tagline.png" alt="Leander ISD Logo" class="lisd-logo"></a>
        </div>
        <div class="nav-right">
            <a href="index.html" class="nav-link">Home</a>
            <a href="feedback.html" class="nav-link active">View Feedback</a>
            <div class="profile-dropdown">
                <div class="nav-icon" id="profileBtn" style="display:flex;align-items:center;justify-content:center;background:var(--gold);color:#1a1a1a;font-weight:700;font-size:14px;">T</div>
                <div class="dropdown-menu hide" id="profileMenu">
                    <h3>Teacher Settings</h3>
                    <button class="dropdown-item" id="themeToggle">Toggle Light/Dark Mode</button>
                    <button class="dropdown-item" onclick="window.location.href='settings.html'">Settings</button>
                    <button class="dropdown-item" onclick="sessionStorage.clear(); window.location.href='/'">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <header class="app-header">
        <h1>Your Feedback</h1>
        <p class="subtitle" id="feedbackSubtitle">Loading...</p>
    </header>

    <!-- Header Card -->
    <div class="feedback-header">
        <div class="feedback-header-text">
            <h3>Student Submissions</h3>
            <p>View all feedback submitted by your students. Use these insights to improve your teaching!</p>
        </div>
    </div>

    <div class="container">
        <div class="feedback-table-container">
            <table id="feedbackTable">
                <thead>
                    <tr>
                        <th>Positive Feedback</th>
                        <th>Constructive Feedback</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody id="feedbackBody"></tbody>
            </table>
        </div>
    </div>

    <script src="teacher.js"></script>
    <script>
        // Auto-refresh feedback every 10 seconds
        setInterval(loadTeacherFeedback, 10000);
        
        // Load on page load
        document.addEventListener('DOMContentLoaded', loadTeacherFeedback);

        async function loadTeacherFeedback() {
            const user = JSON.parse(sessionStorage.getItem('user'));
            if (!user || !user.teacherName) {
                document.getElementById('feedbackBody').innerHTML = 
                    '<tr class="empty-row"><td colspan="3">Please log in as a teacher to view feedback.</td></tr>';
                return;
            }

            try {
                const res = await fetch(`https://reflectify-6h6q.onrender.com/feedback/teacher/${user.teacherName}`);
                const data = await res.json();
                
                const tbody = document.getElementById('feedbackBody');
                const subtitle = document.getElementById('feedbackSubtitle');
                
                subtitle.textContent = `Showing ${data.length} feedback entries for ${user.teacherName}`;
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr class="empty-row"><td colspan="3">No feedback yet. Check back later!</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(f => `
                    <tr>
                        <td>${f.positive || '-'}</td>
                        <td>${f.constructive || '-'}</td>
                        <td>${new Date(f.timestamp).toLocaleString()}</td>
                    </tr>
                `).reverse().join('');
            } catch (err) {
                console.error(err);
                document.getElementById('feedbackBody').innerHTML = 
                    '<tr class="empty-row"><td colspan="3" style="color:#e53935">Failed to load feedback</td></tr>';
            }
        }
    </script>
</body>
</html>
